[project]
name = "ixforge-collector"
version = "0.1.0"
description = "SNMP and ICMP monitoring daemon for IXP infrastructure"
readme = "README.md"
authors = [
    { name = "Carlos Pizarro", email = "carlos@apoapsis.cl" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28",
    "pysnmp>=7.0",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "structlog>=24.0",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
ixforge-collector = "ixforge_collector.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ixforge_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit
    "RUF",   # ruff-specific
]
ignore = [
    "S101",  # assert usado en tests
    "S104",  # bind a 0.0.0.0 (necesario para Docker)
    "S603",  # subprocess calls (no aplica)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Relajado para permitir codigo pragmatico
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "pysnmp.*",
]
ignore_missing_imports = true
